name: ci-linux

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ staging, main ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  LEAN_VERSION: "4.24.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CardanoLedgerApiBlaster

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: CardanoLedgerApiBlaster
      - name: Checkout coordinated Blaster
        uses: actions/checkout@v6
        with:
          repository: input-output-hk/Lean-blaster
          ref: 5270d24e2beb0c038bd453ffffb0ad4972176e7e
          path: Lean-blaster
      - name: Checkout coordinated Core
        uses: actions/checkout@v6
        with:
          repository: input-output-hk/PlutusCoreBlaster
          ref: 9be3edec91b2bbc3a07ee298ebecca3f9b30f560
          path: PlutusCoreBlaster
      - name: Setup Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "/home/runner/.elan/bin" >> $GITHUB_PATH
          chmod +x /home/runner/.elan/bin/*

      - name: Fix Elan version
        run: |
          elan toolchain install ${{ env.LEAN_VERSION }}
          elan default ${{ env.LEAN_VERSION }}

      - uses: actions/cache@v4
        id: solver
        with:
          path: ${{ runner.temp }}/assurance-z3
          key: assurance-z3-${{ runner.os }}-${{ hashFiles('Lean-blaster/scripts/build-assurance-z3.sh') }}
      - name: Build compatible solver
        if: steps.solver.outputs.cache-hit != 'true'
        run: bash ../Lean-blaster/scripts/build-assurance-z3.sh "$RUNNER_TEMP/assurance-z3"
      - name: Select solver
        run: echo "$RUNNER_TEMP/assurance-z3/bin" >> "$GITHUB_PATH"

      - name: Tools version
        run: |
          elan --version
          lake --version
          lean --version
          z3 --version

      - name: Build and Validate CardanoLedgerApi
        run: make check_cardano_ledger_api

      - name: Upload CardanoLedgerApi build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cardano-ledger-api-build
          path: CardanoLedgerApiBlaster/build.log

      - name: Execute and Validate Tests
        run: make check_tests

      - name: Upload Tests log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tests-build
          path: CardanoLedgerApiBlaster/build.log
